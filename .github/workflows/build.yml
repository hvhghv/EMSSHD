name: Build packages

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.16.9'
  FLUTTER_PROJECT: APP/emtask/Flutter

jobs:
  emtask-server-windows-msvc:
    name: emtask server / windows msvc ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vs_arch: x64
          - arch: x86
            vs_arch: Win32
          - arch: arm64
            vs_arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build-emtask-msvc-${{ matrix.arch }}',
            '-G', 'Visual Studio 17 2022',
            '-A', '${{ matrix.vs_arch }}',
            '-DEMSSH_USE_MBEDTLS=ON',
            '-DEMSSH_USE_OPENSSL=OFF',
            '-DEMSSH_USE_WOLFSSL=OFF',
            '-DEMSSH_MBEDTLS_USE_PSA=OFF',
            '-DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON',
            '-DEMSSH_BUILD_EMTASK=ON',
            '-DEMSSH_BUILD_EXAMPLES=ON',
            '-DEMSSH_BUILD_TESTS=OFF',
            '-DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR=${{ github.workspace }}/Libs/external/mbedtls'
          )
          cmake @cmakeArgs

      - name: Build
        shell: pwsh
        run: cmake --build build-emtask-msvc-${{ matrix.arch }} --config Release --target emtask --parallel

      - name: Build SQLite runtime
        shell: pwsh
        run: |
          $sqliteSource = (Resolve-Path 'Libs/external/sqlite/src/sqlite3.c').Path.Replace('\', '/')
          $sqliteSourceDir = 'build-sqlite-src-msvc-${{ matrix.arch }}'
          $sqliteBuildDir = 'build-sqlite-msvc-${{ matrix.arch }}'
          New-Item -ItemType Directory -Force -Path $sqliteSourceDir | Out-Null

          @'
          cmake_minimum_required(VERSION 3.16)
          project(sqlite3_runtime C)
          add_library(sqlite3 SHARED SQLITE_SOURCE_PLACEHOLDER)
          target_compile_definitions(sqlite3 PRIVATE
              SQLITE_THREADSAFE=1
              SQLITE_OMIT_LOAD_EXTENSION=1
              [=[SQLITE_API=__declspec(dllexport)]=]
          )
          '@ -replace 'SQLITE_SOURCE_PLACEHOLDER', $sqliteSource | Set-Content -Encoding UTF8 $sqliteSourceDir/CMakeLists.txt

          $sqliteCmakeArgs = @(
            '-S', $sqliteSourceDir,
            '-B', $sqliteBuildDir,
            '-G', 'Visual Studio 17 2022',
            '-A', '${{ matrix.vs_arch }}'
          )
          cmake @sqliteCmakeArgs
          cmake --build $sqliteBuildDir --config Release --target sqlite3 --parallel

      - name: Build service wrapper
        shell: pwsh
        run: |
          $wrapperOut = 'build-service-wrapper-msvc-${{ matrix.arch }}/emtask-service-wrapper.exe'
          & File/emtask-service/emtask-windows-service.ps1 build-wrapper `
            -WrapperSource File/emtask-service/emtask-service-wrapper.cs `
            -WrapperExe $wrapperOut
          if (-not (Test-Path -LiteralPath $wrapperOut -PathType Leaf)) {
            throw "Service wrapper was not built: $wrapperOut"
          }

      - name: Package
        shell: pwsh
        run: |
          $packageName = 'emtask-server-windows-msvc-${{ matrix.arch }}'
          $packageRoot = 'dist/' + $packageName
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          Copy-Item build-emtask-msvc-${{ matrix.arch }}/Release/emtask.exe $packageRoot/
          Copy-Item build-sqlite-msvc-${{ matrix.arch }}/Release/sqlite3.dll $packageRoot/
          Copy-Item APP/emtask/emtask.conf.example $packageRoot/
          Copy-Item APP/emtask/install.ps1 $packageRoot/install.ps1
          Copy-Item File/emtask-service/emtask-windows-service.ps1 $packageRoot/
          Copy-Item build-service-wrapper-msvc-${{ matrix.arch }}/emtask-service-wrapper.exe $packageRoot/
          Copy-Item File/emtask-service/emtask-service-wrapper.cs $packageRoot/
          Copy-Item APP/emtask/README.md $packageRoot/emtask-README.md
          Copy-Item LICENSE $packageRoot/

          $info = [ordered]@{
            schema = 'github-updater-info/v1'
            repo = '${{ github.repository }}'
            package_type = 'archive'
            artifact = $packageName
            package = $packageName
            app = 'emtask-server'
            platform = 'windows'
            toolchain = 'msvc'
            arch = '${{ matrix.arch }}'
            updater = 'ps1'
            install_script = 'install.ps1'
          }
          $info | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $packageRoot 'info.Dat')
          Copy-Item File/github-updater/ps1/github-update.ps1 dist/github-update.ps1
          Compress-Archive -Path $packageRoot -DestinationPath dist/$packageName.zip -Force
          (Get-FileHash dist/$packageName.zip -Algorithm SHA256).Hash.ToLower() + '  ' + $packageName + '.zip' |
            Set-Content -NoNewline dist/$packageName.zip.sha256

      - name: Test Windows service package
        if: ${{ matrix.arch != 'arm64' }}
        shell: pwsh
        run: |
          & .\.github\scripts\test-emtask-windows-service.ps1 `
            -PackageRoot "dist/emtask-server-windows-msvc-${{ matrix.arch }}" `
            -Label "msvc-${{ matrix.arch }}"

      - name: Skip Windows service runtime test
        if: ${{ matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          Write-Host 'Skipping service runtime test: GitHub-hosted x64 Windows runners cannot execute the ARM64 emtask.exe.'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-server-windows-msvc-${{ matrix.arch }}
          path: |
            dist/emtask-server-windows-msvc-${{ matrix.arch }}.zip
            dist/emtask-server-windows-msvc-${{ matrix.arch }}.zip.sha256
            dist/github-update.ps1
          if-no-files-found: error

  emtask-server-windows-msys2:
    name: emtask server / windows msys2 x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake_args=(
            -S .
            -B build-emtask-msys2-x64
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DEMSSH_USE_MBEDTLS=ON
            -DEMSSH_USE_OPENSSL=OFF
            -DEMSSH_USE_WOLFSSL=OFF
            -DEMSSH_MBEDTLS_USE_PSA=OFF
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON
            -DEMSSH_BUILD_EMTASK=ON
            -DEMSSH_BUILD_EXAMPLES=ON
            -DEMSSH_BUILD_TESTS=OFF
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=OFF
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR=$PWD/Libs/external/mbedtls
          )
          cmake ${cmake_args[@]}

      - name: Build
        shell: msys2 {0}
        run: cmake --build build-emtask-msys2-x64 --target emtask --parallel $(nproc)

      - name: Build SQLite runtime
        shell: msys2 {0}
        run: |
          mkdir -p build-sqlite-msys2-x64
          gcc -O2 -shared -DSQLITE_THREADSAFE=1 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_API='__declspec(dllexport)' Libs/external/sqlite/src/sqlite3.c -o build-sqlite-msys2-x64/sqlite3.dll

      - name: Build service wrapper
        shell: pwsh
        run: |
          $wrapperOut = 'build-service-wrapper-msys2-x64/emtask-service-wrapper.exe'
          & File/emtask-service/emtask-windows-service.ps1 build-wrapper `
            -WrapperSource File/emtask-service/emtask-service-wrapper.cs `
            -WrapperExe $wrapperOut
          if (-not (Test-Path -LiteralPath $wrapperOut -PathType Leaf)) {
            throw "Service wrapper was not built: $wrapperOut"
          }

      - name: Package tree
        shell: msys2 {0}
        run: |
          package_name=emtask-server-windows-msys2-x64
          package_root=dist/$package_name
          rm -rf $package_root
          mkdir -p $package_root

          cp build-emtask-msys2-x64/emtask.exe $package_root/
          cp build-sqlite-msys2-x64/sqlite3.dll $package_root/
          cp APP/emtask/emtask.conf.example $package_root/
          cp APP/emtask/install.ps1 $package_root/install.ps1
          cp File/emtask-service/emtask-windows-service.ps1 $package_root/
          cp build-service-wrapper-msys2-x64/emtask-service-wrapper.exe $package_root/
          cp File/emtask-service/emtask-service-wrapper.cs $package_root/
          cp APP/emtask/README.md $package_root/emtask-README.md
          cp LICENSE $package_root/

          copy_mingw_deps() {
            local binary=$1
            ldd $binary |
              awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^\/mingw64\/bin\/.*[.]dll$/) print $i }' |
              sort -u |
              while read -r dll; do
                cp -n $dll $package_root/
              done
          }

          copy_mingw_deps $package_root/emtask.exe
          copy_mingw_deps $package_root/sqlite3.dll

      - name: Test Windows service package
        shell: pwsh
        run: |
          & .\.github\scripts\test-emtask-windows-service.ps1 `
            -PackageRoot 'dist/emtask-server-windows-msys2-x64' `
            -Label 'msys2-x64'

      - name: Compress package
        shell: pwsh
        run: |
          $packageName = 'emtask-server-windows-msys2-x64'
          $packageRoot = 'dist/' + $packageName

          $info = [ordered]@{
            schema = 'github-updater-info/v1'
            repo = '${{ github.repository }}'
            package_type = 'archive'
            artifact = $packageName
            package = $packageName
            app = 'emtask-server'
            platform = 'windows'
            toolchain = 'msys2'
            arch = 'x64'
            updater = 'ps1'
            install_script = 'install.ps1'
          }
          $info | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $packageRoot 'info.Dat')
          Copy-Item File/github-updater/ps1/github-update.ps1 dist/github-update.ps1
          Compress-Archive -Path $packageRoot -DestinationPath dist/$packageName.zip -Force
          (Get-FileHash dist/$packageName.zip -Algorithm SHA256).Hash.ToLower() + '  ' + $packageName + '.zip' |
            Set-Content -NoNewline dist/$packageName.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-server-windows-msys2-x64
          path: |
            dist/emtask-server-windows-msys2-x64.zip
            dist/emtask-server-windows-msys2-x64.zip.sha256
            dist/github-update.ps1
          if-no-files-found: error

  emtask-server-windows-cygwin:
    name: emtask server / windows cygwin x64
    runs-on: windows-2022
    env:
      CYGWIN_NOWINPATH: 1
      SHELLOPTS: igncr

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: cmake gcc-core ninja

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          gcc --version
          cmake_args=(
            -S .
            -B build-emtask-cygwin-x64
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DEMSSH_USE_MBEDTLS=ON
            -DEMSSH_USE_OPENSSL=OFF
            -DEMSSH_USE_WOLFSSL=OFF
            -DEMSSH_MBEDTLS_USE_PSA=OFF
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON
            -DEMSSH_BUILD_EMTASK=ON
            -DEMSSH_BUILD_EXAMPLES=ON
            -DEMSSH_BUILD_TESTS=OFF
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=OFF
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR=$PWD/Libs/external/mbedtls
          )
          cmake ${cmake_args[@]}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          jobs=$(nproc 2>/dev/null || echo 2)
          cmake --build build-emtask-cygwin-x64 --target emtask --parallel $jobs

      - name: Build SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-sqlite-cygwin-x64
          gcc -O2 -shared -DSQLITE_THREADSAFE=1 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_API='__declspec(dllexport)' Libs/external/sqlite/src/sqlite3.c -o build-sqlite-cygwin-x64/sqlite3.dll -lpthread

      - name: Build service wrapper
        shell: pwsh
        run: |
          $wrapperOut = 'build-service-wrapper-cygwin-x64/emtask-service-wrapper.exe'
          & File/emtask-service/emtask-windows-service.ps1 build-wrapper `
            -WrapperSource File/emtask-service/emtask-service-wrapper.cs `
            -WrapperExe $wrapperOut
          if (-not (Test-Path -LiteralPath $wrapperOut -PathType Leaf)) {
            throw "Service wrapper was not built: $wrapperOut"
          }

      - name: Package tree
        shell: bash
        run: |
          set -euo pipefail
          package_name=emtask-server-windows-cygwin-x64
          package_root=dist/$package_name
          rm -rf $package_root
          mkdir -p $package_root

          cp build-emtask-cygwin-x64/emtask.exe $package_root/
          cp build-sqlite-cygwin-x64/sqlite3.dll $package_root/
          cp APP/emtask/emtask.conf.example $package_root/
          cp APP/emtask/install.ps1 $package_root/install.ps1
          cp File/emtask-service/emtask-windows-service.ps1 $package_root/
          cp build-service-wrapper-cygwin-x64/emtask-service-wrapper.exe $package_root/
          cp File/emtask-service/emtask-service-wrapper.cs $package_root/
          cp APP/emtask/README.md $package_root/emtask-README.md
          cp LICENSE $package_root/

          copy_cygwin_deps() {
            local binary=$1
            echo "Cygwin dependencies for $binary:"
            cygcheck "$binary"
            cygcheck "$binary" |
              awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^[A-Za-z]:\\.*[.]dll$/ || $i ~ /^\/.*[.]dll$/) print $i }' |
              sort -u |
              while read -r dep_path; do
                case $dep_path in
                  [A-Za-z]:*) unix_path=$(cygpath -u "$dep_path") ;;
                  *) unix_path=$dep_path ;;
                esac
                case $unix_path in
                  /bin/*.dll|/usr/bin/*.dll|/usr/local/bin/*.dll)
                    cp -nv "$unix_path" "$package_root/"
                    ;;
                esac
              done
          }

          copy_cygwin_deps $package_root/emtask.exe
          copy_cygwin_deps $package_root/sqlite3.dll
          echo "Packaged Cygwin emtask files:"
          find "$package_root" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Test Windows service package
        shell: pwsh
        run: |
          & .\.github\scripts\test-emtask-windows-service.ps1 `
            -PackageRoot 'dist/emtask-server-windows-cygwin-x64' `
            -Label 'cygwin-x64'

      - name: Compress package
        shell: pwsh
        run: |
          $packageName = 'emtask-server-windows-cygwin-x64'
          $packageRoot = 'dist/' + $packageName

          $info = [ordered]@{
            schema = 'github-updater-info/v1'
            repo = '${{ github.repository }}'
            package_type = 'archive'
            artifact = $packageName
            package = $packageName
            app = 'emtask-server'
            platform = 'windows'
            toolchain = 'cygwin'
            arch = 'x64'
            updater = 'ps1'
            install_script = 'install.ps1'
          }
          $info | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $packageRoot 'info.Dat')
          Copy-Item File/github-updater/ps1/github-update.ps1 dist/github-update.ps1
          Compress-Archive -Path $packageRoot -DestinationPath dist/$packageName.zip -Force
          (Get-FileHash dist/$packageName.zip -Algorithm SHA256).Hash.ToLower() + '  ' + $packageName + '.zip' |
            Set-Content -NoNewline dist/$packageName.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-server-windows-cygwin-x64
          path: |
            dist/emtask-server-windows-cygwin-x64.zip
            dist/emtask-server-windows-cygwin-x64.zip.sha256
            dist/github-update.ps1
          if-no-files-found: error

  emtask-server-linux-glibc:
    name: emtask server / linux glibc ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            processor: x86_64
            c_compiler: gcc
            apt_packages: libcrypt-dev
            passwd_auth: 'ON'
            cross: 'false'
          - arch: x86
            processor: i686
            c_compiler: i686-linux-gnu-gcc
            apt_packages: gcc-i686-linux-gnu
            passwd_auth: 'OFF'
            cross: 'true'
          - arch: aarch64
            processor: aarch64
            c_compiler: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu
            passwd_auth: 'OFF'
            cross: 'true'
          - arch: arm
            processor: arm
            c_compiler: arm-linux-gnueabihf-gcc
            apt_packages: gcc-arm-linux-gnueabihf
            passwd_auth: 'OFF'
            cross: 'true'
          - arch: riscv64
            processor: riscv64
            c_compiler: riscv64-linux-gnu-gcc
            apt_packages: gcc-riscv64-linux-gnu
            passwd_auth: 'OFF'
            cross: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ${{ matrix.apt_packages }}

      - name: Configure
        run: |
          build_dir=build-emtask-linux-glibc-${{ matrix.arch }}
          cmake_args=(
            -S .
            -B $build_dir
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
            -DEMSSH_USE_MBEDTLS=ON
            -DEMSSH_USE_OPENSSL=OFF
            -DEMSSH_USE_WOLFSSL=OFF
            -DEMSSH_MBEDTLS_USE_PSA=OFF
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON
            -DEMSSH_BUILD_EMTASK=ON
            -DEMSSH_BUILD_EXAMPLES=ON
            -DEMSSH_BUILD_TESTS=OFF
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=${{ matrix.passwd_auth }}
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR=${{ github.workspace }}/Libs/external/mbedtls
          )

          if [ '${{ matrix.cross }}' = 'true' ]; then
            cmake_args+=(
              -DCMAKE_SYSTEM_NAME=Linux
              -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }}
            )
          fi

          cmake ${cmake_args[@]}

      - name: Build
        run: cmake --build build-emtask-linux-glibc-${{ matrix.arch }} --target emtask --parallel

      - name: Package
        run: |
          package_name=emtask-server-linux-glibc-${{ matrix.arch }}
          build_dir=build-emtask-linux-glibc-${{ matrix.arch }}
          package_root=dist/$package_name
          rm -rf $package_root
          mkdir -p $package_root

          cp $build_dir/emtask $package_root/
          if [ '${{ matrix.arch }}' = 'x64' ]; then
            cp File/sqlite-runtime/linux-x64/libsqlite3.so* $package_root/
          else
            ${{ matrix.c_compiler }} -O2 -fPIC -shared -DSQLITE_THREADSAFE=1 -DSQLITE_OMIT_LOAD_EXTENSION=1 -Wl,-soname,libsqlite3.so.0 Libs/external/sqlite/src/sqlite3.c -o $package_root/libsqlite3.so.0 -ldl -lpthread
            ln -s libsqlite3.so.0 $package_root/libsqlite3.so
          fi
          cp APP/emtask/emtask.conf.example $package_root/
          cp APP/emtask/Linux/install.sh $package_root/install.sh
          cp APP/emtask/README.md $package_root/emtask-README.md
          cp LICENSE $package_root/
          chmod +x $package_root/emtask $package_root/install.sh

          cat > $package_root/info.Dat <<EOF
          {
            "schema": "github-updater-info/v1",
            "repo": "${{ github.repository }}",
            "package_type": "archive",
            "artifact": "$package_name",
            "package": "$package_name",
            "app": "emtask-server",
            "platform": "linux",
            "toolchain": "glibc",
            "arch": "${{ matrix.arch }}",
            "updater": "sh",
            "install_script": "install.sh"
          }
          EOF
          cp File/github-updater/sh/github-update.sh dist/github-update.sh
          chmod +x dist/github-update.sh
          tar -czf dist/$package_name.tar.gz -C dist $package_name
          sha256sum dist/$package_name.tar.gz > dist/$package_name.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-server-linux-glibc-${{ matrix.arch }}
          path: |
            dist/emtask-server-linux-glibc-${{ matrix.arch }}.tar.gz
            dist/emtask-server-linux-glibc-${{ matrix.arch }}.tar.gz.sha256
            dist/github-update.sh
          if-no-files-found: error

  emtask-server-linux-musl:
    name: emtask server / linux musl ${{ matrix.linkage }} ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            linkage: dynamic
            processor: x86_64
            toolchain: x86_64-linux-musl
            toolchain_asset: musl-toolchain-x86_64.tar.gz
          - arch: x64
            linkage: static
            processor: x86_64
            toolchain: x86_64-linux-musl
            toolchain_asset: musl-toolchain-x86_64.tar.gz
          - arch: arm
            linkage: dynamic
            processor: arm
            toolchain: arm-linux-musleabi
            toolchain_asset: musl-toolchain-arm.tar.gz
          - arch: arm
            linkage: static
            processor: arm
            toolchain: arm-linux-musleabi
            toolchain_asset: musl-toolchain-arm.tar.gz
          - arch: aarch64
            linkage: dynamic
            processor: aarch64
            toolchain: aarch64-linux-musl
            toolchain_asset: musl-toolchain-aarch64.tar.gz
          - arch: aarch64
            linkage: static
            processor: aarch64
            toolchain: aarch64-linux-musl
            toolchain_asset: musl-toolchain-aarch64.tar.gz
          - arch: riscv64
            linkage: dynamic
            processor: riscv64
            toolchain: riscv64-linux-musl
            toolchain_asset: musl-toolchain-riscv64.tar.gz
          - arch: riscv64
            linkage: static
            processor: riscv64
            toolchain: riscv64-linux-musl
            toolchain_asset: musl-toolchain-riscv64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl file

      - name: Install musl cross toolchain
        run: |
          set -euo pipefail
          toolchain=${{ matrix.toolchain }}
          asset=${{ matrix.toolchain_asset }}
          mkdir -p $RUNNER_TEMP/musl-cross
          archive=$RUNNER_TEMP/$asset
          musl_base=https://github.com/${{ github.repository_owner }}/musl-gcc/releases/download/musl-gcc
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o $archive $musl_base/$asset
          test -s $archive
          tar -xzf $archive -C $RUNNER_TEMP/musl-cross
          compiler_path=$(find $RUNNER_TEMP/musl-cross -type f -name "${toolchain}-gcc" | head -n 1)
          if [ -z "$compiler_path" ]; then
            echo "${toolchain}-gcc not found in $asset" >&2
            find $RUNNER_TEMP/musl-cross -maxdepth 4 -type f -name '*-gcc' >&2
            exit 1
          fi
          chmod +x $compiler_path
          compiler_bin=$(dirname $compiler_path)
          echo $compiler_bin >> $GITHUB_PATH
          echo "MUSL_CC=$compiler_path" >> $GITHUB_ENV
          $compiler_path --version

      - name: Configure
        run: |
          build_dir=build-emtask-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}
          cmake_args=(
            -S .
            -B $build_dir
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_SYSTEM_NAME=Linux
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }}
            -DCMAKE_C_COMPILER=$MUSL_CC
            -DEMSSH_USE_MBEDTLS=ON
            -DEMSSH_USE_OPENSSL=OFF
            -DEMSSH_USE_WOLFSSL=OFF
            -DEMSSH_MBEDTLS_USE_PSA=OFF
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON
            -DEMSSH_BUILD_EMTASK=ON
            -DEMSSH_BUILD_EXAMPLES=ON
            -DEMSSH_BUILD_TESTS=OFF
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=OFF
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR=${{ github.workspace }}/Libs/external/mbedtls
          )
          if [ '${{ matrix.linkage }}' = 'static' ]; then
            cmake_args+=(-DCMAKE_EXE_LINKER_FLAGS=-static)
          fi
          cmake ${cmake_args[@]}

      - name: Build
        run: cmake --build build-emtask-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }} --target emtask --parallel

      - name: Verify binary linkage
        run: |
          set -euo pipefail
          binary=build-emtask-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}/emtask
          file "$binary" | tee linkage-check.txt
          if [ '${{ matrix.linkage }}' = 'static' ]; then
            grep -qi 'statically linked' linkage-check.txt
          else
            grep -qi 'dynamically linked' linkage-check.txt
          fi

      - name: Package
        run: |
          package_name=emtask-server-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}
          build_dir=build-emtask-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}
          package_root=dist/$package_name
          rm -rf $package_root
          mkdir -p $package_root

          cp $build_dir/emtask $package_root/
          $MUSL_CC -O2 -fPIC -shared -DSQLITE_THREADSAFE=1 -DSQLITE_OMIT_LOAD_EXTENSION=1 -Wl,-soname,libsqlite3.so.0 Libs/external/sqlite/src/sqlite3.c -o $package_root/libsqlite3.so.0 -pthread
          ln -s libsqlite3.so.0 $package_root/libsqlite3.so
          cp APP/emtask/emtask.conf.example $package_root/
          cp APP/emtask/Linux/install.sh $package_root/install.sh
          cp APP/emtask/README.md $package_root/emtask-README.md
          cp LICENSE $package_root/
          chmod +x $package_root/emtask $package_root/install.sh

          cat > $package_root/info.Dat <<EOF
          {
            "schema": "github-updater-info/v1",
            "repo": "${{ github.repository }}",
            "package_type": "archive",
            "artifact": "$package_name",
            "package": "$package_name",
            "app": "emtask-server",
            "platform": "linux",
            "toolchain": "musl-${{ matrix.linkage }}",
            "arch": "${{ matrix.arch }}",
            "updater": "sh",
            "install_script": "install.sh"
          }
          EOF
          cp File/github-updater/sh/github-update.sh dist/github-update.sh
          chmod +x dist/github-update.sh
          tar -czf dist/$package_name.tar.gz -C dist $package_name
          sha256sum dist/$package_name.tar.gz > dist/$package_name.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-server-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}
          path: |
            dist/emtask-server-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}.tar.gz
            dist/emtask-server-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}.tar.gz.sha256
            dist/github-update.sh
          if-no-files-found: error

  emtask-client-android-apk:
    name: emtask client / android apk
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' platform-tools

      - name: Restore Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: emtask-client-android-debug-keystore-v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ] || [ ! -f android/build.gradle ] || [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android --project-name emtask_client --org com.emtask .
            git checkout -- android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin/com/emtask/emtask_client/MainActivity.kt android/app/src/main/res || true
          fi
          chmod +x android/gradlew
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: flutter build apk --release

      - name: Package APK
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/emtask-client-android-release.apk
          cat > dist/info.Dat <<EOF
          {
            "schema": "github-updater-info/v1",
            "repo": "${{ github.repository }}",
            "package_type": "apk",
            "artifact": "emtask-client-android-apk",
            "package": "emtask-client-android-release.apk",
            "app": "emtask-client",
            "platform": "android",
            "toolchain": "flutter",
            "arch": "universal",
            "updater": "android",
            "install_script": ""
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-client-android-apk
          path: |
            APP/emtask/Flutter/dist/emtask-client-android-release.apk
            APP/emtask/Flutter/dist/info.Dat
          if-no-files-found: error

