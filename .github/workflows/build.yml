          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter build windows --release

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $project = '${{ env.FLUTTER_PROJECT }}'
          $packageName = 'emtask-client-windows-x64'
          $bundleSource = $project + '/build/windows/x64/runner/Release'
          $packageRoot = $project + '/dist/' + $packageName

          New-Item -ItemType Directory -Force -Path $packageRoot, $packageRoot/docs | Out-Null
          Copy-Item $bundleSource/* $packageRoot -Recurse -Force
          Copy-Item $project/README.md $packageRoot/docs/emtask-client-README.md
          Copy-Item $project/install.ps1 $packageRoot/install.ps1
          Copy-Item LICENSE $packageRoot/docs/

          $info = [ordered]@{
            schema = 'github-updater-info/v1'
            repo = '${{ github.repository }}'
            package_type = 'archive'
            artifact = $packageName
            package = $packageName
            app = 'emtask-client'
            platform = 'windows'
            toolchain = 'flutter'
            arch = 'x64'
            updater = 'ps1'
            install_script = 'install.ps1'
