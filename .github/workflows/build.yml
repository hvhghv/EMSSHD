          if-no-files-found: error

  emsshd-windows-cygwin:
    name: emsshd / windows cygwin x64
    runs-on: windows-latest
    env:
      CYGWIN_NOWINPATH: 1
      SHELLOPTS: igncr

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: cmake gcc-core ninja

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake_args=(
            -S .
            -B build-emsshd-cygwin-x64
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DEMSSH_USE_MBEDTLS=ON
            -DEMSSH_USE_OPENSSL=OFF
            -DEMSSH_USE_WOLFSSL=OFF
            -DEMSSH_MBEDTLS_USE_PSA=OFF
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON
            -DEMSSH_MBEDTLS_LEGACY_CONFIG_FILE=
            -DEMSSH_BUILD_EXAMPLES=ON
            -DEMSSH_BUILD_TESTS=OFF
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=OFF
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR=$PWD/Libs/external/mbedtls
          )
          cmake ${cmake_args[@]}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          jobs=$(nproc 2>/dev/null || echo 2)
          cmake --build build-emsshd-cygwin-x64 --target emssh_concurrent_server --parallel $jobs

      - name: Package tree
        shell: bash
        run: |
          set -euo pipefail
          package_name=emsshd-windows-cygwin-x64
          package_root=dist/$package_name
          rm -rf $package_root
          mkdir -p $package_root/bin $package_root/docs

          cp build-emsshd-cygwin-x64/emssh_concurrent_server.exe $package_root/bin/emsshd.exe
          cp APP/emsshd/install.ps1 $package_root/install.ps1
          cp LICENSE $package_root/docs/
          cat > $package_root/docs/README-windows.txt <<'EOF'
          emsshd Windows Cygwin package

          This package uses the current cross-platform concurrent SSH/SFTP server target
          (emssh_concurrent_server) and packages it as bin/emsshd.exe.

          Basic usage:
            emsshd.exe <port> <root-dir> <username> <password> [hostkey-file] [--max-workers N] [--max-connections N] [--timeout-ms N]
          EOF

          copy_cygwin_deps() {
            local binary=$1
            echo "Cygwin dependencies for $binary:"
            cygcheck "$binary"
            cygcheck "$binary" |
              awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^[A-Za-z]:\\.*[.]dll$/ || $i ~ /^\/.*[.]dll$/) print $i }' |
              sort -u |
              while read -r dep_path; do
                case $dep_path in
                  [A-Za-z]:*) unix_path=$(cygpath -u "$dep_path") ;;
                  *) unix_path=$dep_path ;;
                esac
                case $unix_path in
                  /bin/*.dll|/usr/bin/*.dll|/usr/local/bin/*.dll)
                    cp -nv "$unix_path" "$package_root/bin/"
                    ;;
                esac
              done
          }

          copy_cygwin_deps $package_root/bin/emsshd.exe
          echo "Packaged Cygwin emsshd files:"
          find "$package_root" -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Compress package
        shell: pwsh
        run: |
          $packageName = 'emsshd-windows-cygwin-x64'
          $packageRoot = 'dist/' + $packageName

          $info = [ordered]@{
            schema = 'github-updater-info/v1'
            repo = '${{ github.repository }}'
            package_type = 'archive'
            artifact = $packageName
            package = $packageName
            app = 'emsshd'
            platform = 'windows'
            toolchain = 'cygwin'
            arch = 'x64'
            updater = 'ps1'
            install_script = 'install.ps1'
          }
          $info | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $packageRoot 'info.Dat')
          Copy-Item File/github-updater/ps1/github-update.ps1 dist/github-update.ps1
          Compress-Archive -Path $packageRoot -DestinationPath dist/$packageName.zip -Force
          (Get-FileHash dist/$packageName.zip -Algorithm SHA256).Hash.ToLower() + '  ' + $packageName + '.zip' |
            Set-Content -NoNewline dist/$packageName.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emsshd-windows-cygwin-x64
          path: |
            dist/emsshd-windows-cygwin-x64.zip
            dist/emsshd-windows-cygwin-x64.zip.sha256
            dist/github-update.ps1
          if-no-files-found: error

  emsshd-linux-glibc:
    name: emsshd / linux glibc ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            processor: x86_64
            triplet: x86_64-linux-gnu
            c_compiler: gcc
            apt_packages: libcrypt-dev
            passwd_auth: 'ON'
            cross: 'false'
          - arch: x86
            processor: i686
            triplet: i686-linux-gnu
            c_compiler: i686-linux-gnu-gcc
            apt_packages: gcc-i686-linux-gnu
            passwd_auth: 'OFF'
            cross: 'true'
          - arch: arm
            processor: arm
            triplet: arm-linux-gnueabihf
            c_compiler: arm-linux-gnueabihf-gcc
            apt_packages: gcc-arm-linux-gnueabihf
            passwd_auth: 'OFF'
            cross: 'true'
          - arch: aarch64
            processor: aarch64
            triplet: aarch64-linux-gnu
            c_compiler: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu
            passwd_auth: 'OFF'
            cross: 'true'
          - arch: riscv64
            processor: riscv64
            triplet: riscv64-linux-gnu
            c_compiler: riscv64-linux-gnu-gcc
            apt_packages: gcc-riscv64-linux-gnu
            passwd_auth: 'OFF'
            cross: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 openssh-client ${{ matrix.apt_packages }}

      - name: Configure
        run: |
          build_dir=build-emsshd-linux-glibc-${{ matrix.arch }}
          cmake_args=(
            -S .
            -B $build_dir
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
            -DEMSSH_USE_MBEDTLS=ON
            -DEMSSH_USE_OPENSSL=OFF
            -DEMSSH_USE_WOLFSSL=OFF
            -DEMSSH_MBEDTLS_USE_PSA=OFF
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON
            -DEMSSH_MBEDTLS_LEGACY_CONFIG_FILE=${{ github.workspace }}/APP/emsshd/Linux/mbedtls_config_port.h
            -DEMSSH_BUILD_EXAMPLES=ON
            -DEMSSH_BUILD_TESTS=ON
            -DEMSSH_BUILD_STDIO_FS=ON
            -DEMSSH_BUILD_POSIX_RUNTIME=ON
            -DEMSSH_BUILD_POSIX_NET=ON
            -DEMSSH_BUILD_POSIX_TERM=ON
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=${{ matrix.passwd_auth }}
            -DEMSSH_BUILD_SSHD_CONFIG_FILE=ON
            -DEMSSH_BUILD_LINUX_POSIX_STDIO_SERVER=ON
            -DEMSSH_LINUX_POSIX_STDIO_SERVER_BACKEND=mbedtls
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR=${{ github.workspace }}/Libs/external/mbedtls
          )

          if [ '${{ matrix.cross }}' = 'true' ]; then
            cmake_args+=(
              -DCMAKE_SYSTEM_NAME=Linux
              -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }}
              -DCMAKE_FIND_ROOT_PATH=/usr/${{ matrix.triplet }}
              -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
              -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
            )
          fi

          cmake ${cmake_args[@]}

      - name: Build
        run: cmake --build build-emsshd-linux-glibc-${{ matrix.arch }} --target emssh_linux_posix_stdio_server --parallel

      - name: Verify OpenSSH RSA HostKey import
        if: ${{ matrix.arch == 'x64' }}
        run: |
          set -euo pipefail
          cmake --build build-emsshd-linux-glibc-${{ matrix.arch }} --target test_mbedtls_openssh_key --parallel
          ctest --test-dir build-emsshd-linux-glibc-${{ matrix.arch }} -R test_mbedtls_openssh_key --output-on-failure

      - name: Smoke test startup and OpenSSH HostKey config
        if: ${{ matrix.arch == 'x64' }}
        run: |
          set -euo pipefail
          EMSSHD_VERIFY_PORT=2222 \
            bash tools/verify_emsshd_linux_startup.sh \
            build-emsshd-linux-glibc-${{ matrix.arch }}/emssh_linux_posix_stdio_server

      - name: Package
        run: |
          package_name=emsshd-linux-glibc-${{ matrix.arch }}
          build_dir=build-emsshd-linux-glibc-${{ matrix.arch }}
          package_root=dist/$package_name
          rm -rf $package_root
          mkdir -p $package_root/bin $package_root/config $package_root/docs $package_root/init.d

          cp $build_dir/emssh_linux_posix_stdio_server $package_root/bin/emsshd
          cp APP/emsshd/Linux/install.sh $package_root/install.sh
          cp APP/emsshd/Linux/init.d/S98emsshd $package_root/init.d/
          cp File/ssh/sshd_config $package_root/config/sshd_config.example
          cp LICENSE $package_root/docs/
          cat > $package_root/docs/README-linux.txt <<'EOF'
          emsshd Linux package

          Binary: bin/emsshd
          Example init script: init.d/S98emsshd
          Example config: config/sshd_config.example

          Basic usage:
            emsshd --sshd-config <path> --passwd-file <path> --shadow-file <path> --session-mode auto
          EOF
          chmod +x $package_root/bin/emsshd $package_root/init.d/S98emsshd $package_root/install.sh

          cat > $package_root/info.Dat <<EOF
          {
            "schema": "github-updater-info/v1",
            "repo": "${{ github.repository }}",
            "package_type": "archive",
            "artifact": "$package_name",
            "package": "$package_name",
            "app": "emsshd",
            "platform": "linux",
            "toolchain": "glibc",
            "arch": "${{ matrix.arch }}",
            "updater": "sh",
            "install_script": "install.sh"
          }
          EOF
          cp File/github-updater/sh/github-update.sh dist/github-update.sh
          chmod +x dist/github-update.sh
          tar -czf dist/$package_name.tar.gz -C dist $package_name
          sha256sum dist/$package_name.tar.gz > dist/$package_name.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emsshd-linux-glibc-${{ matrix.arch }}
          path: |
            dist/emsshd-linux-glibc-${{ matrix.arch }}.tar.gz
            dist/emsshd-linux-glibc-${{ matrix.arch }}.tar.gz.sha256
            dist/github-update.sh
          if-no-files-found: error

  emsshd-linux-musl:
    name: emsshd / linux musl ${{ matrix.linkage }} ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            linkage: dynamic
            processor: x86_64
            toolchain: x86_64-linux-musl
            toolchain_asset: musl-toolchain-x86_64.tar.gz
          - arch: x64
            linkage: static
            processor: x86_64
            toolchain: x86_64-linux-musl
            toolchain_asset: musl-toolchain-x86_64.tar.gz
          - arch: arm
            linkage: dynamic
            processor: arm
            toolchain: arm-linux-musleabi
            toolchain_asset: musl-toolchain-arm.tar.gz
          - arch: arm
            linkage: static
            processor: arm
            toolchain: arm-linux-musleabi
            toolchain_asset: musl-toolchain-arm.tar.gz
          - arch: aarch64
            linkage: dynamic
            processor: aarch64
            toolchain: aarch64-linux-musl
            toolchain_asset: musl-toolchain-aarch64.tar.gz
          - arch: aarch64
            linkage: static
            processor: aarch64
            toolchain: aarch64-linux-musl
            toolchain_asset: musl-toolchain-aarch64.tar.gz
          - arch: riscv64
            linkage: dynamic
            processor: riscv64
            toolchain: riscv64-linux-musl
            toolchain_asset: musl-toolchain-riscv64.tar.gz
          - arch: riscv64
            linkage: static
            processor: riscv64
            toolchain: riscv64-linux-musl
            toolchain_asset: musl-toolchain-riscv64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl file python3 openssh-client qemu-user-static

      - name: Install musl cross toolchain
        run: |
          set -euo pipefail
          toolchain=${{ matrix.toolchain }}
          asset=${{ matrix.toolchain_asset }}
          mkdir -p $RUNNER_TEMP/musl-cross
          archive=$RUNNER_TEMP/$asset
          musl_base=https://github.com/${{ github.repository_owner }}/musl-gcc/releases/download/musl-gcc
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o $archive $musl_base/$asset
          test -s $archive
          tar -xzf $archive -C $RUNNER_TEMP/musl-cross
          compiler_path=$(find $RUNNER_TEMP/musl-cross -type f -name "${toolchain}-gcc" | head -n 1)
          if [ -z "$compiler_path" ]; then
            echo "${toolchain}-gcc not found in $asset" >&2
            find $RUNNER_TEMP/musl-cross -maxdepth 4 -type f -name '*-gcc' >&2
            exit 1
          fi
          chmod +x $compiler_path
          compiler_bin=$(dirname $compiler_path)
          sysroot=$($compiler_path -print-sysroot)
          echo $compiler_bin >> $GITHUB_PATH
          echo "MUSL_CC=$compiler_path" >> $GITHUB_ENV
          echo "MUSL_SYSROOT=$sysroot" >> $GITHUB_ENV
          $compiler_path --version

      - name: Configure
        run: |
          toolchain=${{ matrix.toolchain }}
          build_dir=build-emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}
          cmake_args=(
            -S .
            -B $build_dir
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_SYSTEM_NAME=Linux
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }}
            -DCMAKE_C_COMPILER=$MUSL_CC
            -DCMAKE_FIND_ROOT_PATH=$MUSL_SYSROOT
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
            -DEMSSH_USE_MBEDTLS=ON
            -DEMSSH_USE_OPENSSL=OFF
            -DEMSSH_USE_WOLFSSL=OFF
            -DEMSSH_MBEDTLS_USE_PSA=OFF
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON
            -DEMSSH_MBEDTLS_LEGACY_CONFIG_FILE=${{ github.workspace }}/APP/emsshd/Linux/mbedtls_config_port.h
            -DEMSSH_BUILD_EXAMPLES=ON
            -DEMSSH_BUILD_TESTS=ON
            -DEMSSH_BUILD_STDIO_FS=ON
            -DEMSSH_BUILD_POSIX_RUNTIME=ON
            -DEMSSH_BUILD_POSIX_NET=ON
            -DEMSSH_BUILD_POSIX_TERM=ON
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=ON
            -DEMSSH_BUILD_SSHD_CONFIG_FILE=ON
            -DEMSSH_BUILD_LINUX_POSIX_STDIO_SERVER=ON
            -DEMSSH_LINUX_POSIX_STDIO_SERVER_BACKEND=mbedtls
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR=${{ github.workspace }}/Libs/external/mbedtls
          )
          if [ '${{ matrix.linkage }}' = 'static' ]; then
            cmake_args+=(-DCMAKE_EXE_LINKER_FLAGS=-static)
          fi
          cmake ${cmake_args[@]}

      - name: Build
        run: cmake --build build-emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }} --target emssh_linux_posix_stdio_server --parallel

      - name: Verify OpenSSH RSA HostKey import
        if: ${{ matrix.linkage == 'static' && matrix.arch == 'x64' }}
        run: |
          set -euo pipefail
          cmake --build build-emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }} --target test_mbedtls_openssh_key --parallel
          ctest --test-dir build-emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }} -R test_mbedtls_openssh_key --output-on-failure

      - name: Verify binary linkage
        run: |
          set -euo pipefail
          binary=build-emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}/emssh_linux_posix_stdio_server
          file "$binary" | tee linkage-check.txt
          if [ '${{ matrix.linkage }}' = 'static' ]; then
            grep -qi 'statically linked' linkage-check.txt
          else
            grep -qi 'dynamically linked' linkage-check.txt
          fi

      - name: Smoke test startup and OpenSSH HostKey config
        if: ${{ matrix.linkage == 'static' }}
        run: |
          set -euo pipefail
          runner=
          case '${{ matrix.arch }}' in
            x64)
              ;;
            arm)
              runner=qemu-arm-static
              ;;
            aarch64)
              runner=qemu-aarch64-static
              ;;
            riscv64)
              runner=qemu-riscv64-static
              ;;
            *)
              echo "unsupported smoke-test arch: ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac
          if [ -n "$runner" ]; then
            command -v "$runner"
            export EMSSHD_RUNNER="$runner"
          fi
          EMSSHD_VERIFY_PORT=2222 \
            bash tools/verify_emsshd_linux_startup.sh \
            build-emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}/emssh_linux_posix_stdio_server

      - name: Package
        run: |
          package_name=emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}
          build_dir=build-emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}
          package_root=dist/$package_name
          rm -rf $package_root
          mkdir -p $package_root/bin $package_root/config $package_root/docs $package_root/init.d

          cp $build_dir/emssh_linux_posix_stdio_server $package_root/bin/emsshd
          cp APP/emsshd/Linux/install.sh $package_root/install.sh
          cp APP/emsshd/Linux/init.d/S98emsshd $package_root/init.d/
          cp File/ssh/sshd_config $package_root/config/sshd_config.example
          cp LICENSE $package_root/docs/
          cat > $package_root/docs/README-linux.txt <<'EOF'
          emsshd Linux musl package

          Binary: bin/emsshd
          Example init script: init.d/S98emsshd
          Example config: config/sshd_config.example

          Basic usage:
            emsshd --sshd-config <path> --passwd-file <path> --shadow-file <path> --session-mode auto
          EOF
          chmod +x $package_root/bin/emsshd $package_root/init.d/S98emsshd $package_root/install.sh

          cat > $package_root/info.Dat <<EOF
          {
            "schema": "github-updater-info/v1",
            "repo": "${{ github.repository }}",
            "package_type": "archive",
            "artifact": "$package_name",
            "package": "$package_name",
            "app": "emsshd",
            "platform": "linux",
            "toolchain": "musl-${{ matrix.linkage }}",
            "arch": "${{ matrix.arch }}",
            "updater": "sh",
            "install_script": "install.sh"
          }
          EOF
          cp File/github-updater/sh/github-update.sh dist/github-update.sh
          chmod +x dist/github-update.sh
          tar -czf dist/$package_name.tar.gz -C dist $package_name
          sha256sum dist/$package_name.tar.gz > dist/$package_name.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}
          path: |
            dist/emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}.tar.gz
            dist/emsshd-linux-musl-${{ matrix.linkage }}-${{ matrix.arch }}.tar.gz.sha256
            dist/github-update.sh
          if-no-files-found: error

  release-packages:
    name: release / packages
    runs-on: ubuntu-22.04
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    needs:
      - emtask-server-windows-msvc
      - emtask-server-windows-msys2
      - emtask-server-windows-cygwin
      - emtask-server-linux-glibc
      - emtask-server-linux-musl
      - emtask-client-android-apk
      - emtask-client-windows
      - emtask-client-linux
      - emsshd-windows-msvc
      - emsshd-windows-msys2
      - emsshd-windows-cygwin
      - emsshd-linux-glibc
      - emsshd-linux-musl

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: em*-*
          merge-multiple: true
          path: release-artifacts

      - name: Prepare Release packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for path in release-artifacts/*; do
            name=$(basename "$path")
            lower=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
            if [ "$name" != "$lower" ]; then
              target="release-artifacts/$lower"
              if [ -e "$target" ]; then
                echo "Cannot normalize release asset name; target already exists: $target" >&2
                exit 1
              fi
              mv "$path" "$target"
            fi
          done

          for package in release-artifacts/*.zip; do
            case "$(basename "$package")" in
              *android*.zip)
                continue
                ;;
            esac

            work_dir=$(mktemp -d)
            unzip -q "$package" -d "$work_dir"
            cp release-artifacts/github-update.ps1 "$work_dir/github-update.ps1"
            rm -f "$package"
            (
              cd "$work_dir"
              zip -qr "$GITHUB_WORKSPACE/$package" *
            )
            rm -rf "$work_dir"
            sha256sum "$package" > "$package.sha256"
          done

          for package in release-artifacts/*.tar.gz; do
            work_dir=$(mktemp -d)
            tar -xzf "$package" -C "$work_dir"
            cp release-artifacts/github-update.sh "$work_dir/github-update.sh"
            chmod +x "$work_dir/github-update.sh"
            rm -f "$package"
            (
              cd "$work_dir"
              tar -czf "$GITHUB_WORKSPACE/$package" *
            )
            rm -rf "$work_dir"
            sha256sum "$package" > "$package.sha256"
          done

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.zip
            release-artifacts/*.tar.gz
            release-artifacts/*.apk
          fail_on_unmatched_files: true
