            repo = '${{ github.repository }}'
            package_type = 'archive'
            artifact = $packageName
            package = $packageName
            app = 'emsshd'
            platform = 'windows'
            toolchain = 'msys2'
            arch = 'x64'
            updater = 'ps1'
            install_script = 'install.ps1'
