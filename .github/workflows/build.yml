            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake_args=(
            -S .
            -B build-emsshd-msys2-x64
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_EXE_LINKER_FLAGS=-lbcrypt
            -DEMSSH_USE_MBEDTLS=ON
