name: Build emtask client

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.16.9"
  FLUTTER_PROJECT: APP/emtask/Flutter

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          chmod +x android/gradlew
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: flutter build apk --release

      - name: Package APK
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/emtask-client-android-release.apk
          sha256sum dist/emtask-client-android-release.apk > dist/emtask-client-android-release.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-client-android-apk
          path: |
            APP/emtask/Flutter/dist/emtask-client-android-release.apk
            APP/emtask/Flutter/dist/emtask-client-android-release.apk.sha256
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter build windows --release

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $project = "${{ env.FLUTTER_PROJECT }}"
          $packageName = "emtask-client-windows-x64"
          $bundleSource = Join-Path $project "build/windows/x64/runner/Release"
          $packageRoot = Join-Path $project "dist/$packageName"

          New-Item -ItemType Directory -Force -Path $packageRoot, "$packageRoot/docs" | Out-Null
          Copy-Item "$bundleSource/*" $packageRoot -Recurse -Force
          Copy-Item "$project/README.md" "$packageRoot/docs/emtask-client-README.md"
          Copy-Item "LICENSE" "$packageRoot/docs/"

          Compress-Archive -Path $packageRoot -DestinationPath "$project/dist/$packageName.zip" -Force
          (Get-FileHash "$project/dist/$packageName.zip" -Algorithm SHA256).Hash.ToLower() + "  $packageName.zip" |
            Set-Content -NoNewline "$project/dist/$packageName.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-client-windows-x64
          path: |
            APP/emtask/Flutter/dist/emtask-client-windows-x64.zip
            APP/emtask/Flutter/dist/emtask-client-windows-x64.zip.sha256
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Linux
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: flutter build linux --release

      - name: Package Linux bundle
        run: |
          project="${{ env.FLUTTER_PROJECT }}"
          package_name="emtask-client-linux-x64"
          bundle_source="$project/build/linux/x64/release/bundle"
          package_root="$project/dist/$package_name"

          rm -rf "$package_root"
          mkdir -p "$package_root/docs"
          cp -a "$bundle_source/." "$package_root/"
          cp "$project/README.md" "$package_root/docs/emtask-client-README.md"
          cp LICENSE "$package_root/docs/"

          tar -czf "$project/dist/$package_name.tar.gz" -C "$project/dist" "$package_name"
          sha256sum "$project/dist/$package_name.tar.gz" > "$project/dist/$package_name.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-client-linux-x64
          path: |
            APP/emtask/Flutter/dist/emtask-client-linux-x64.tar.gz
            APP/emtask/Flutter/dist/emtask-client-linux-x64.tar.gz.sha256
          if-no-files-found: error