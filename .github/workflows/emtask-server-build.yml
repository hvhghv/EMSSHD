name: Build emtask

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows MSVC ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vs_arch: x64
          - arch: x86
            vs_arch: Win32
          - arch: arm
            vs_arch: ARM
          - arch: arm64
            vs_arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build-emtask-msvc-${{ matrix.arch }}",
            "-G", "Visual Studio 17 2022",
            "-A", "${{ matrix.vs_arch }}",
            "-DEMSSH_USE_MBEDTLS=ON",
            "-DEMSSH_USE_OPENSSL=OFF",
            "-DEMSSH_USE_WOLFSSL=OFF",
            "-DEMSSH_MBEDTLS_USE_PSA=OFF",
            "-DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON",
            "-DEMSSH_BUILD_EMTASK=ON",
            "-DEMSSH_BUILD_EXAMPLES=ON",
            "-DEMSSH_BUILD_TESTS=OFF",
            "-DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR=${{ github.workspace }}/Libs/external/mbedtls"
          )
          cmake @cmakeArgs

      - name: Build
        shell: pwsh
        run: cmake --build "build-emtask-msvc-${{ matrix.arch }}" --config Release --target emtask --parallel

      - name: Build SQLite runtime
        shell: pwsh
        run: |
          $sqliteSource = (Resolve-Path "Libs/external/sqlite/src/sqlite3.c").Path.Replace('\', '/')
          $sqliteSourceDir = "build-sqlite-src-msvc-${{ matrix.arch }}"
          $sqliteBuildDir = "build-sqlite-msvc-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $sqliteSourceDir | Out-Null

          @"
          cmake_minimum_required(VERSION 3.16)
          project(sqlite3_runtime C)
          add_library(sqlite3 SHARED "$sqliteSource")
          target_compile_definitions(sqlite3 PRIVATE
              SQLITE_THREADSAFE=1
              SQLITE_OMIT_LOAD_EXTENSION=1
              "SQLITE_API=__declspec(dllexport)"
          )
          "@ | Set-Content -Encoding UTF8 "$sqliteSourceDir/CMakeLists.txt"

          cmake -S $sqliteSourceDir -B $sqliteBuildDir -G "Visual Studio 17 2022" -A "${{ matrix.vs_arch }}"
          cmake --build $sqliteBuildDir --config Release --target sqlite3 --parallel

      - name: Package
        shell: pwsh
        run: |
          $packageName = "emtask-windows-msvc-${{ matrix.arch }}"
          $packageRoot = "dist/$packageName"
          New-Item -ItemType Directory -Force -Path "$packageRoot/bin", "$packageRoot/config", "$packageRoot/docs", "$packageRoot/tools" | Out-Null

          Copy-Item "build-emtask-msvc-${{ matrix.arch }}/Release/emtask.exe" "$packageRoot/bin/"
          Copy-Item "build-sqlite-msvc-${{ matrix.arch }}/Release/sqlite3.dll" "$packageRoot/bin/"
          Copy-Item "APP/emtask/emtask.conf.example" "$packageRoot/config/"
          Copy-Item "File/emtask-service/emtask-windows-service.ps1" "$packageRoot/tools/"
          Copy-Item "File/emtask-service/emtask-service-wrapper.exe" "$packageRoot/tools/"
          Copy-Item "File/emtask-service/emtask-service-wrapper.cs" "$packageRoot/tools/"
          Copy-Item "APP/emtask/README.md" "$packageRoot/docs/emtask-README.md"
          Copy-Item "LICENSE" "$packageRoot/docs/"

          Compress-Archive -Path $packageRoot -DestinationPath "dist/$packageName.zip" -Force
          (Get-FileHash "dist/$packageName.zip" -Algorithm SHA256).Hash.ToLower() + "  $packageName.zip" |
            Set-Content -NoNewline "dist/$packageName.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-windows-msvc-${{ matrix.arch }}
          path: |
            dist/emtask-windows-msvc-${{ matrix.arch }}.zip
            dist/emtask-windows-msvc-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  windows-msys2:
    name: Windows MSYS2 x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build-emtask-msys2-x64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEMSSH_USE_MBEDTLS=ON \
            -DEMSSH_USE_OPENSSL=OFF \
            -DEMSSH_USE_WOLFSSL=OFF \
            -DEMSSH_MBEDTLS_USE_PSA=OFF \
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON \
            -DEMSSH_BUILD_EMTASK=ON \
            -DEMSSH_BUILD_EXAMPLES=ON \
            -DEMSSH_BUILD_TESTS=OFF \
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=OFF \
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR="$PWD/Libs/external/mbedtls"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build-emtask-msys2-x64 --target emtask --parallel "$(nproc)"

      - name: Build SQLite runtime
        shell: msys2 {0}
        run: |
          mkdir -p build-sqlite-msys2-x64
          gcc -O2 -shared \
            -DSQLITE_THREADSAFE=1 \
            -DSQLITE_OMIT_LOAD_EXTENSION=1 \
            -DSQLITE_API='__declspec(dllexport)' \
            Libs/external/sqlite/src/sqlite3.c \
            -o build-sqlite-msys2-x64/sqlite3.dll

      - name: Package tree
        shell: msys2 {0}
        run: |
          package_name="emtask-windows-msys2-x64"
          package_root="dist/$package_name"
          rm -rf "$package_root"
          mkdir -p "$package_root/bin" "$package_root/config" "$package_root/docs" "$package_root/tools"

          cp "build-emtask-msys2-x64/emtask.exe" "$package_root/bin/"
          cp "build-sqlite-msys2-x64/sqlite3.dll" "$package_root/bin/"
          cp "APP/emtask/emtask.conf.example" "$package_root/config/"
          cp "File/emtask-service/emtask-windows-service.ps1" "$package_root/tools/"
          cp "File/emtask-service/emtask-service-wrapper.exe" "$package_root/tools/"
          cp "File/emtask-service/emtask-service-wrapper.cs" "$package_root/tools/"
          cp "APP/emtask/README.md" "$package_root/docs/emtask-README.md"
          cp "LICENSE" "$package_root/docs/"

          copy_mingw_deps() {
            local binary="$1"
            ldd "$binary" |
              awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^\/mingw64\/bin\/.*\.dll$/) print $i }' |
              sort -u |
              while read -r dll; do
                cp -n "$dll" "$package_root/bin/"
              done
          }

          copy_mingw_deps "$package_root/bin/emtask.exe"
          copy_mingw_deps "$package_root/bin/sqlite3.dll"

      - name: Compress package
        shell: pwsh
        run: |
          $packageName = "emtask-windows-msys2-x64"
          $packageRoot = "dist/$packageName"

          Compress-Archive -Path $packageRoot -DestinationPath "dist/$packageName.zip" -Force
          (Get-FileHash "dist/$packageName.zip" -Algorithm SHA256).Hash.ToLower() + "  $packageName.zip" |
            Set-Content -NoNewline "dist/$packageName.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-windows-msys2-x64
          path: |
            dist/emtask-windows-msys2-x64.zip
            dist/emtask-windows-msys2-x64.zip.sha256
          if-no-files-found: error

  windows-cygwin:
    name: Windows Cygwin x64
    runs-on: windows-latest
    env:
      CYGWIN_NOWINPATH: 1
      SHELLOPTS: igncr

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: cmake gcc-core ninja

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          gcc --version
          cmake -S . -B build-emtask-cygwin-x64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEMSSH_USE_MBEDTLS=ON \
            -DEMSSH_USE_OPENSSL=OFF \
            -DEMSSH_USE_WOLFSSL=OFF \
            -DEMSSH_MBEDTLS_USE_PSA=OFF \
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON \
            -DEMSSH_BUILD_EMTASK=ON \
            -DEMSSH_BUILD_EXAMPLES=ON \
            -DEMSSH_BUILD_TESTS=OFF \
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=OFF \
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR="$PWD/Libs/external/mbedtls"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(nproc 2>/dev/null || echo 2)"
          cmake --build build-emtask-cygwin-x64 --target emtask --parallel "$jobs"

      - name: Build SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-sqlite-cygwin-x64
          gcc -O2 -shared \
            -DSQLITE_THREADSAFE=1 \
            -DSQLITE_OMIT_LOAD_EXTENSION=1 \
            -DSQLITE_API='__declspec(dllexport)' \
            Libs/external/sqlite/src/sqlite3.c \
            -o build-sqlite-cygwin-x64/sqlite3.dll \
            -lpthread

      - name: Package tree
        shell: bash
        run: |
          set -euo pipefail
          package_name="emtask-windows-cygwin-x64"
          package_root="dist/$package_name"
          rm -rf "$package_root"
          mkdir -p "$package_root/bin" "$package_root/config" "$package_root/docs" "$package_root/tools"

          cp "build-emtask-cygwin-x64/emtask.exe" "$package_root/bin/"
          cp "build-sqlite-cygwin-x64/sqlite3.dll" "$package_root/bin/"
          cp "APP/emtask/emtask.conf.example" "$package_root/config/"
          cp "File/emtask-service/emtask-windows-service.ps1" "$package_root/tools/"
          cp "File/emtask-service/emtask-service-wrapper.exe" "$package_root/tools/"
          cp "File/emtask-service/emtask-service-wrapper.cs" "$package_root/tools/"
          cp "APP/emtask/README.md" "$package_root/docs/emtask-README.md"
          cp "LICENSE" "$package_root/docs/"

          copy_cygwin_deps() {
            local binary="$1"
            cygcheck "$binary" |
              awk '/^[[:space:]]+[A-Za-z]:\\/ { print $1 }' |
              sort -u |
              while read -r win_path; do
                unix_path="$(cygpath -u "$win_path")"
                case "$unix_path" in
                  /bin/*.dll|/usr/bin/*.dll)
                    cp -n "$unix_path" "$package_root/bin/"
                    ;;
                esac
              done
          }

          copy_cygwin_deps "$package_root/bin/emtask.exe"
          copy_cygwin_deps "$package_root/bin/sqlite3.dll"

      - name: Compress package
        shell: pwsh
        run: |
          $packageName = "emtask-windows-cygwin-x64"
          $packageRoot = "dist/$packageName"

          Compress-Archive -Path $packageRoot -DestinationPath "dist/$packageName.zip" -Force
          (Get-FileHash "dist/$packageName.zip" -Algorithm SHA256).Hash.ToLower() + "  $packageName.zip" |
            Set-Content -NoNewline "dist/$packageName.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-windows-cygwin-x64
          path: |
            dist/emtask-windows-cygwin-x64.zip
            dist/emtask-windows-cygwin-x64.zip.sha256
          if-no-files-found: error

  linux-glibc:
    name: Linux glibc ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            processor: x86_64
            c_compiler: gcc
            apt_packages: libcrypt-dev
            passwd_auth: "ON"
            cross: "false"
          - arch: x86
            processor: i686
            c_compiler: i686-linux-gnu-gcc
            apt_packages: gcc-i686-linux-gnu
            passwd_auth: "OFF"
            cross: "true"
          - arch: aarch64
            processor: aarch64
            c_compiler: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu
            passwd_auth: "OFF"
            cross: "true"
          - arch: arm
            processor: arm
            c_compiler: arm-linux-gnueabihf-gcc
            apt_packages: gcc-arm-linux-gnueabihf
            passwd_auth: "OFF"
            cross: "true"
          - arch: riscv64
            processor: riscv64
            c_compiler: riscv64-linux-gnu-gcc
            apt_packages: gcc-riscv64-linux-gnu
            passwd_auth: "OFF"
            cross: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ${{ matrix.apt_packages }}

      - name: Configure
        run: |
          build_dir="build-emtask-linux-glibc-${{ matrix.arch }}"
          cmake_args=(
            -S .
            -B "$build_dir"
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
            -DEMSSH_USE_MBEDTLS=ON
            -DEMSSH_USE_OPENSSL=OFF
            -DEMSSH_USE_WOLFSSL=OFF
            -DEMSSH_MBEDTLS_USE_PSA=OFF
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON
            -DEMSSH_BUILD_EMTASK=ON
            -DEMSSH_BUILD_EXAMPLES=ON
            -DEMSSH_BUILD_TESTS=OFF
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=${{ matrix.passwd_auth }}
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR="${{ github.workspace }}/Libs/external/mbedtls"
          )

          if [ "${{ matrix.cross }}" = "true" ]; then
            cmake_args+=(
              -DCMAKE_SYSTEM_NAME=Linux
              -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }}
            )
          fi

          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build "build-emtask-linux-glibc-${{ matrix.arch }}" --target emtask --parallel

      - name: Package
        run: |
          package_name="emtask-linux-glibc-${{ matrix.arch }}"
          build_dir="build-emtask-linux-glibc-${{ matrix.arch }}"
          package_root="dist/$package_name"
          mkdir -p "$package_root/bin" "$package_root/config" "$package_root/docs"

          cp "$build_dir/emtask" "$package_root/bin/"
          if [ "${{ matrix.arch }}" = "x64" ]; then
            cp File/sqlite-runtime/linux-x64/libsqlite3.so* "$package_root/bin/"
          else
            ${{ matrix.c_compiler }} -O2 -fPIC -shared \
              -DSQLITE_THREADSAFE=1 \
              -DSQLITE_OMIT_LOAD_EXTENSION=1 \
              -Wl,-soname,libsqlite3.so.0 \
              Libs/external/sqlite/src/sqlite3.c \
              -o "$package_root/bin/libsqlite3.so.0" \
              -ldl -lpthread
            ln -s libsqlite3.so.0 "$package_root/bin/libsqlite3.so"
          fi
          cp "APP/emtask/emtask.conf.example" "$package_root/config/"
          cp "APP/emtask/README.md" "$package_root/docs/emtask-README.md"
          cp "LICENSE" "$package_root/docs/"
          chmod +x "$package_root/bin/emtask"

          tar -czf "dist/$package_name.tar.gz" -C dist "$package_name"
          sha256sum "dist/$package_name.tar.gz" > "dist/$package_name.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-linux-glibc-${{ matrix.arch }}
          path: |
            dist/emtask-linux-glibc-${{ matrix.arch }}.tar.gz
            dist/emtask-linux-glibc-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  linux-musl:
    name: Linux musl ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            processor: x86_64
            toolchain: x86_64-linux-musl
          - arch: x86
            processor: i686
            toolchain: i686-linux-musl
          - arch: arm
            processor: arm
            toolchain: arm-linux-musleabihf
          - arch: aarch64
            processor: aarch64
            toolchain: aarch64-linux-musl
          - arch: riscv64
            processor: riscv64
            toolchain: riscv64-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl

      - name: Install musl cross toolchain
        run: |
          toolchain="${{ matrix.toolchain }}"
          mkdir -p "$RUNNER_TEMP/musl-cross"
          curl -L --retry 3 --retry-delay 5 \
            -o "$RUNNER_TEMP/${toolchain}-cross.tgz" \
            "https://musl.cc/${toolchain}-cross.tgz"
          tar -xzf "$RUNNER_TEMP/${toolchain}-cross.tgz" -C "$RUNNER_TEMP/musl-cross"
          echo "$RUNNER_TEMP/musl-cross/${toolchain}-cross/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          build_dir="build-emtask-linux-musl-${{ matrix.arch }}"
          cmake -S . -B "$build_dir" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -DCMAKE_C_COMPILER=${{ matrix.toolchain }}-gcc \
            -DEMSSH_USE_MBEDTLS=ON \
            -DEMSSH_USE_OPENSSL=OFF \
            -DEMSSH_USE_WOLFSSL=OFF \
            -DEMSSH_MBEDTLS_USE_PSA=OFF \
            -DEMSSH_MBEDTLS_CLASSIC_LAYOUT=ON \
            -DEMSSH_BUILD_EMTASK=ON \
            -DEMSSH_BUILD_EXAMPLES=ON \
            -DEMSSH_BUILD_TESTS=OFF \
            -DEMSSH_BUILD_POSIX_PASSWD_AUTH=OFF \
            -DEMSSH_MBEDTLS_CLASSIC_SOURCE_DIR="${{ github.workspace }}/Libs/external/mbedtls"

      - name: Build
        run: cmake --build "build-emtask-linux-musl-${{ matrix.arch }}" --target emtask --parallel

      - name: Package
        run: |
          package_name="emtask-linux-musl-${{ matrix.arch }}"
          build_dir="build-emtask-linux-musl-${{ matrix.arch }}"
          package_root="dist/$package_name"
          mkdir -p "$package_root/bin" "$package_root/config" "$package_root/docs"

          cp "$build_dir/emtask" "$package_root/bin/"
          ${{ matrix.toolchain }}-gcc -O2 -fPIC -shared \
            -DSQLITE_THREADSAFE=1 \
            -DSQLITE_OMIT_LOAD_EXTENSION=1 \
            -Wl,-soname,libsqlite3.so.0 \
            Libs/external/sqlite/src/sqlite3.c \
            -o "$package_root/bin/libsqlite3.so.0" \
            -pthread
          ln -s libsqlite3.so.0 "$package_root/bin/libsqlite3.so"
          cp "APP/emtask/emtask.conf.example" "$package_root/config/"
          cp "APP/emtask/README.md" "$package_root/docs/emtask-README.md"
          cp "LICENSE" "$package_root/docs/"
          chmod +x "$package_root/bin/emtask"

          tar -czf "dist/$package_name.tar.gz" -C dist "$package_name"
          sha256sum "dist/$package_name.tar.gz" > "dist/$package_name.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emtask-linux-musl-${{ matrix.arch }}
          path: |
            dist/emtask-linux-musl-${{ matrix.arch }}.tar.gz
            dist/emtask-linux-musl-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
