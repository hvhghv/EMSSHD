# Reusable Linux musl cross-compile setup snippets.
# Paste the needed parts into an ubuntu job and replace placeholders.
# This assumes musl toolchains are published as tar.gz assets from:
# https://github.com/hvhghv/musl-gcc/releases/download/musl-gcc/<toolchain-asset>
# Before using or updating this template, read the release page instructions:
# https://github.com/hvhghv/musl-gcc/releases/tag/musl-gcc
# Currently available musl-gcc toolchains are only:
# x86_64-linux-musl, arm-linux-musleabi, aarch64-linux-musl, riscv64-linux-musl.
# Each supported target should produce both dynamic and static builds.

# Example matrix:
# strategy:
#   fail-fast: false
#   matrix:
#     include:
#       - arch: x64
#         linkage: dynamic
#         processor: x86_64
#         toolchain: x86_64-linux-musl
#         toolchain_asset: musl-toolchain-x86_64.tar.gz
#       - arch: x64
#         linkage: static
#         processor: x86_64
#         toolchain: x86_64-linux-musl
#         toolchain_asset: musl-toolchain-x86_64.tar.gz
#       - arch: arm
#         linkage: dynamic
#         processor: arm
#         toolchain: arm-linux-musleabi
#         toolchain_asset: musl-toolchain-arm.tar.gz
#       - arch: arm
#         linkage: static
#         processor: arm
#         toolchain: arm-linux-musleabi
#         toolchain_asset: musl-toolchain-arm.tar.gz
#       - arch: aarch64
#         linkage: dynamic
#         processor: aarch64
#         toolchain: aarch64-linux-musl
#         toolchain_asset: musl-toolchain-aarch64.tar.gz
#       - arch: aarch64
#         linkage: static
#         processor: aarch64
#         toolchain: aarch64-linux-musl
#         toolchain_asset: musl-toolchain-aarch64.tar.gz
#       - arch: riscv64
#         linkage: dynamic
#         processor: riscv64
#         toolchain: riscv64-linux-musl
#         toolchain_asset: musl-toolchain-riscv64.tar.gz
#       - arch: riscv64
#         linkage: static
#         processor: riscv64
#         toolchain: riscv64-linux-musl
#         toolchain_asset: musl-toolchain-riscv64.tar.gz

- name: Install musl cross build dependencies
  shell: bash
  run: |
    set -euo pipefail
    sudo apt-get update
    sudo apt-get install -y build-essential cmake ninja-build curl file qemu-user-static

- name: Install musl cross toolchain
  shell: bash
  run: |
    set -euo pipefail
    toolchain=${{ matrix.toolchain }}
    asset=${{ matrix.toolchain_asset }}
    mkdir -p "$RUNNER_TEMP/musl-cross"
    archive="$RUNNER_TEMP/$asset"
    musl_base='https://github.com/hvhghv/musl-gcc/releases/download/musl-gcc'
    curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o "$archive" "$musl_base/$asset"
    test -s "$archive"
    tar -xzf "$archive" -C "$RUNNER_TEMP/musl-cross"

    compiler_path=$(find "$RUNNER_TEMP/musl-cross" -type f -name "${toolchain}-gcc" | head -n 1)
    if [ -z "$compiler_path" ]; then
      echo "${toolchain}-gcc not found in $asset" >&2
      find "$RUNNER_TEMP/musl-cross" -maxdepth 4 -type f -name '*-gcc' >&2
      exit 1
    fi

    chmod +x "$compiler_path"
    compiler_bin=$(dirname "$compiler_path")
    sysroot=$($compiler_path -print-sysroot)
    echo "$compiler_bin" >> "$GITHUB_PATH"
    echo "MUSL_CC=$compiler_path" >> "$GITHUB_ENV"
    echo "MUSL_SYSROOT=$sysroot" >> "$GITHUB_ENV"
    "$compiler_path" --version

- name: Configure CMake for musl cross build
  shell: bash
  run: |
    set -euo pipefail
    build_dir='<build-dir-prefix>-${{ matrix.linkage }}-${{ matrix.arch }}'
    qemu_emulator=''
    case '${{ matrix.arch }}' in
      x64|x86_64)
        ;;
      arm|armhf|armv7)
        qemu_emulator="qemu-arm-static;-L;$MUSL_SYSROOT"
        ;;
      aarch64|arm64)
        qemu_emulator="qemu-aarch64-static;-L;$MUSL_SYSROOT"
        ;;
      riscv64)
        qemu_emulator="qemu-riscv64-static;-L;$MUSL_SYSROOT"
        ;;
    esac

    cmake_args=(
      -S .
      -B "$build_dir"
      -G Ninja
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_SYSTEM_NAME=Linux
      -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }}
      -DCMAKE_C_COMPILER=$MUSL_CC
      -DCMAKE_FIND_ROOT_PATH=$MUSL_SYSROOT
      -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
      -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
      -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
      -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY
      # Add project-specific CMake options here.
    )
    if [ '${{ matrix.linkage }}' = 'static' ]; then
      cmake_args+=(-DCMAKE_EXE_LINKER_FLAGS=-static)
    fi
    if [ -n "$qemu_emulator" ]; then
      cmake_args+=("-DCMAKE_CROSSCOMPILING_EMULATOR=$qemu_emulator")
    fi
    cmake "${cmake_args[@]}"

- name: Build CMake target
  shell: bash
  run: cmake --build '<build-dir-prefix>-${{ matrix.linkage }}-${{ matrix.arch }}' --target <target-name> --parallel

- name: Verify binary linkage
  shell: bash
  run: |
    set -euo pipefail
    binary='<binary-path>'
    file "$binary" | tee linkage-check.txt
    if [ '${{ matrix.linkage }}' = 'static' ]; then
      grep -qi 'statically linked' linkage-check.txt
    else
      grep -qi 'dynamically linked' linkage-check.txt
    fi

- name: Set up QEMU test runner
  shell: bash
  run: |
    set -euo pipefail
    runner=''
    case '${{ matrix.arch }}' in
      x64|x86_64)
        ;;
      arm|armhf|armv7)
        runner=qemu-arm-static
        ;;
      aarch64|arm64)
        runner=qemu-aarch64-static
        ;;
      riscv64)
        runner=qemu-riscv64-static
        ;;
      *)
        echo "unsupported qemu test arch: ${{ matrix.arch }}" >&2
        exit 1
        ;;
    esac

    if [ -n "$runner" ]; then
      command -v "$runner"
      echo "QEMU_RUNNER=$runner" >> "$GITHUB_ENV"
    else
      echo 'QEMU_RUNNER=' >> "$GITHUB_ENV"
    fi

- name: Run QEMU smoke test
  shell: bash
  run: |
    set -euo pipefail
    binary='<binary-path>'
    if [ -n "${QEMU_RUNNER:-}" ]; then
      if [ -n "${MUSL_SYSROOT:-}" ]; then
        $QEMU_RUNNER -L "$MUSL_SYSROOT" "$binary" <test-args>
      else
        $QEMU_RUNNER "$binary" <test-args>
      fi
    else
      "$binary" <test-args>
    fi

- name: Run CTest through QEMU
  shell: bash
  run: ctest --test-dir '<build-dir-prefix>-${{ matrix.linkage }}-${{ matrix.arch }}' --output-on-failure
