# Reusable Release job for package assets.
# Paste this under `jobs:` and replace placeholders.
# It publishes only real install packages/APKs. It intentionally does not publish
# *.sha256 or bare github-update.* files as Release assets.

release-packages:
  name: release / packages
  runs-on: ubuntu-22.04
  if: ${{ startsWith(github.ref, 'refs/tags/v') }}
  permissions:
    contents: write
  needs:
    # - <build-job-1>
    # - <build-job-2>
    - <release-needs>

  steps:
    - name: Download package artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: <artifact-pattern>
        merge-multiple: true
        path: release-artifacts

    - name: Prepare Release packages
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob

        for package in release-artifacts/*.zip; do
          case "$(basename "$package")" in
            *android*.zip)
              continue
              ;;
          esac

          work_dir=$(mktemp -d)
          unzip -q "$package" -d "$work_dir"
          cp release-artifacts/github-update.ps1 "$work_dir/github-update.ps1"
          rm -f "$package"
          (
            cd "$work_dir"
            zip -qr "$GITHUB_WORKSPACE/$package" *
          )
          rm -rf "$work_dir"
          sha256sum "$package" > "$package.sha256"
        done

        for package in release-artifacts/*.tar.gz; do
          work_dir=$(mktemp -d)
          tar -xzf "$package" -C "$work_dir"
          cp release-artifacts/github-update.sh "$work_dir/github-update.sh"
          chmod +x "$work_dir/github-update.sh"
          rm -f "$package"
          (
            cd "$work_dir"
            tar -czf "$GITHUB_WORKSPACE/$package" *
          )
          rm -rf "$work_dir"
          sha256sum "$package" > "$package.sha256"
        done

    - name: Publish GitHub Release assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-artifacts/*.zip
          release-artifacts/*.tar.gz
          release-artifacts/*.apk
        fail_on_unmatched_files: true
